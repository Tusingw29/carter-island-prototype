<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="dev">
  <title>Carter Island prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="alert-meter" data-state="calm">
    <span id="alert-label">CALM</span>
    <div class="bar"><div id="alert-fill"></div></div>
  </div>

  <div id="prompt" class="tag" hidden></div>
  <pre id="debug-panel" class="debug-only"></pre>

  <div id="mash" class="banner" hidden>
    <strong>GRABBED! Mash SPACE (or X) to break free</strong>
    <div class="bar"><div id="mash-fill"></div></div>
  </div>

  <div id="caught" class="banner" hidden>
    <strong class="big">CAUGHT</strong>
    <button id="restart" type="button">Restart (Enter)</button>
  </div>

  <p id="help">
    A/D move &nbsp; Shift run &nbsp; S crouch &nbsp; W hide &nbsp; Space knock out / drag &nbsp; F1 or ` debug
    <span>Controller: stick move, RT run, Down crouch, Up hide, X knock out / drag, R3 debug</span>
  </p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
